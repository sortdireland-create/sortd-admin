<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFDF6">
<title>Content calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,800&display=swap" rel="stylesheet">
<style>
:root{--cream:#FFFDF6;--navy:#1F2347;--lilac:#D9CCF5;--butter:#FFF1C2;--slate:#4A4E6E;--line:#E7E2F2;--soft:#F6F2FC;--sortd:#4782A8;--sortdsoft:#E6F0F7;--cherry:#C8243A;--green:#2F7D55}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--navy);font-family:'DM Sans',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:18px 18px 90px;max-width:1100px;margin:0 auto}
button{font-family:inherit;cursor:pointer;color:inherit}
.h1{font-size:22px;font-weight:800;letter-spacing:-.03em}
.lab{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--slate)}
.meta{font-size:13px;color:var(--slate)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{font-size:14px;font-weight:500;border:1px solid var(--navy);border-radius:9px;padding:8px 13px;background:#fff}
.btn.go{background:var(--navy);color:var(--butter)}
.btn.sm{font-size:12px;padding:5px 10px}
.btn:disabled{opacity:.5}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;font-size:14px;font-weight:600;line-height:1.2}
.tabs button .n{display:block;font-size:22px;font-weight:800;margin-top:2px}
.tabs button.on{background:var(--navy);color:var(--butter);border-color:var(--navy)}
.panel{background:var(--soft);border-radius:14px;padding:14px;margin-top:12px}
.day{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.day.today{border:2px solid var(--navy)}
.day.past{opacity:.6}
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.lane .lh{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding-bottom:4px;border-bottom:2px solid}
.lane.s .lh{color:var(--sortd);border-color:var(--sortd)}
.lane.r .lh{color:var(--navy);border-color:var(--lilac)}
.empty{font-size:13px;color:#A3A6BD;padding:8px 0}
.card{display:block;width:100%;text-align:left;border-radius:10px;padding:9px 10px;margin-top:6px;font-size:14px;line-height:1.3;border:0}
.lane.s .card{background:var(--sortdsoft)}
.lane.r .card{background:var(--soft)}
.card .k{font-size:11px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.05em}
.card.auto{background:#fff!important;border:1px dashed var(--sortd);color:var(--slate)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;border-radius:999px;padding:2px 8px;margin-top:5px}
.b-write{background:var(--butter);color:var(--navy)}
.b-film{background:#FCE3E6;color:var(--cherry)}
.b-claude{background:var(--lilac);color:var(--navy)}
.b-ready{background:#DDF1E5;color:var(--green)}
.b-posted{background:var(--navy);color:var(--butter)}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.item.s{border-left:5px solid var(--sortd)}
.item.r{border-left:5px solid var(--lilac)}
.grp{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);margin-top:20px}
.box{background:var(--soft);border-radius:9px;padding:10px;font-size:14px;line-height:1.5;margin-top:6px;white-space:pre-wrap;word-wrap:break-word}
textarea,input[type=text],input[type=url],input[type=password],input[type=date]{width:100%;font-family:inherit;font-size:16px;border-radius:9px;border:1px solid var(--line);padding:10px;background:#fff;color:var(--navy)}
textarea{min-height:150px;line-height:1.45}
.err{font-size:13px;color:var(--cherry);min-height:16px;margin-top:4px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.chk input{width:20px;height:20px;flex:none;accent-color:var(--navy)}
#sheet{position:fixed;inset:0;background:rgba(31,35,71,.45);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:30px 12px}
#sheet .in{background:var(--cream);border-radius:16px;max-width:680px;width:100%;padding:18px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;pointer-events:none}
#toast span{background:var(--navy);color:var(--butter);padding:9px 15px;border-radius:999px;font-size:14px}
#login{max-width:360px;margin:12vh auto 0}
.hidden{display:none!important}
.foot{margin-top:30px;font-size:13px}
.foot a{color:var(--slate)}
@media (max-width:640px){
  body{padding:12px 12px 90px}
  .tabs button{font-size:12px;padding:8px 4px}
  .tabs button .n{font-size:19px}
  #sheet{padding:0}
  #sheet .in{border-radius:0;min-height:100%}
}
</style>
</head>
<body>

<div id="login" class="panel">
  <div class="h1">Content calendar</div>
  <div class="meta" style="margin:6px 0 12px">Same password as the Sortd admin page.</div>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
  <div class="err" id="pwerr"></div>
  <button class="btn go" id="pwgo">Open</button>
</div>

<div id="app" class="hidden">
  <div class="row between">
    <span class="h1">Content calendar</span>
    <div class="row"><button class="btn sm" id="refresh">Refresh</button><button class="btn sm" id="logout">Log out</button></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="main"></div>
  <div class="foot"><a href="/content-classic">B-roll list, filming scripts, Sunday notes and suggestions →</a></div>
</div>
<div id="sheet" class="hidden"><div class="in" id="sheetin"></div></div>
<div id="toast"></div>

<script>
(function(){
'use strict';
var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], D = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var store = {
  get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del: function(k){ try { localStorage.removeItem(k); } catch(e){} }
};
var pw = store.get('cc_pw') || '';
var DATA = {posts:[], today:null};
var st = {view:'week', monday:null, open:null, checks: JSON.parse(store.get('cc_checks2') || '{}')};

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ms(d){ return Date.parse(d + 'T12:00:00Z'); }
function iso(t){ return new Date(t).toISOString().slice(0,10); }
function add(d, n){ return iso(ms(d) + n*864e5); }
function today(){ return DATA.today || iso(Date.now()); }
function mondayOf(d){ var w = new Date(ms(d)).getUTCDay(); return add(d, -((w + 6) % 7)); }
function fmt(d){ var x = new Date(ms(d)); return D[x.getUTCDay()] + ' ' + x.getUTCDate() + ' ' + M[x.getUTCMonth()]; }
function short(d){ var x = new Date(ms(d)); return x.getUTCDate() + ' ' + M[x.getUTCMonth()]; }
function daysTo(d){ return Math.round((ms(d) - ms(today())) / 864e5); }
function when(d){ var n = daysTo(d); return n === 0 ? 'today' : n === 1 ? 'tomorrow' : n === -1 ? 'yesterday' : n > 0 ? 'in ' + n + ' days' : Math.abs(n) + ' days late'; }

var tt;
function toast(t){ $('toast').innerHTML = '<span>' + esc(t) + '</span>'; clearTimeout(tt); tt = setTimeout(function(){ $('toast').innerHTML = ''; }, 2400); }
function api(action, extra){
  return fetch('/.netlify/functions/content', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(Object.assign({password: pw, action: action}, extra || {}))})
    .then(function(r){ return r.json().catch(function(){ return {error:'Bad response'}; }).then(function(j){ if (!r.ok){ var e = new Error(j.error || ('Error ' + r.status)); e.status = r.status; throw e; } return j; }); });
}
function copy(text, label){
  var done = function(){ toast(label + ' copied'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fb); else fb();
  function fb(){ var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch(e){ toast('Copy failed'); } document.body.removeChild(t); }
}

// ---------- the model ----------
// brand: 's' Sortd, 'r' Rach Hannon. stage: write → (film) → claude → ready → posted
function brand(p){ return (p.Account === 'Sortd' || p.Pillar === 'Sortd') ? 's' : 'r'; }
function stage(p){
  var s = p.Status || 'Planned';
  if (s === 'Posted' || s === 'Done') return 'posted';
  if (s === 'Skipped') return 'skip';
  if (s === 'With Claude' || s === 'Filmed') return 'claude';
  if (s === 'Ready' || s === 'Edited') return 'ready';
  if (s === 'Scripted') return (p.Kind === 'Reel' || p.Kind === 'Story') ? 'film' : 'claude';
  return 'write';
}
var BADGE = {write:['b-write','Write copy'], film:['b-film','Film it'], claude:['b-claude','With Claude'], ready:['b-ready','Ready to post'], posted:['b-posted','Posted']};
function badge(sg){ var b = BADGE[sg]; return b ? '<span class="badge ' + b[0] + '">' + b[1] + '</span>' : ''; }
function accLabel(p){ var b = brand(p); if (p.Account === 'LinkedIn') return (b === 's' ? 'Sortd' : 'Rach') + ' · LinkedIn'; if (p.Account === 'Working Notes') return 'Working Notes'; return b === 's' ? 'Sortd' : '@rach.hannon'; }
function live(){ return DATA.posts.filter(function(p){ return p.Date && p.Kind !== 'Task' && stage(p) !== 'skip' && p.Status !== 'Idea'; }); }
function byDate(a, b){ return a.Date < b.Date ? -1 : a.Date > b.Date ? 1 : 0; }
function inStage(sg){ return live().filter(function(p){ return stage(p) === sg; }).sort(byDate); }
function find(id){ return DATA.posts.filter(function(p){ return p.id === id; })[0]; }
function autos(d){
  var w = new Date(ms(d)).getUTCDay();
  return (w === 1 || w === 4) ? [{auto:true, Title:'New listings roundup', Kind:'Carousel'}] : [];
}

// ---------- views ----------
function render(){
  var n = {week:'', write: inStage('write').length + inStage('film').length, claude: inStage('claude').length, ready: inStage('ready').length};
  $('tabs').innerHTML = [['week','To post','📅'],['write','To write',n.write],['claude','With Claude',n.claude],['ready','Ready',n.ready]].map(function(t){
    return '<button data-v="' + t[0] + '" class="' + (st.view === t[0] ? 'on' : '') + '">' + t[1] + '<span class="n">' + (t[0] === 'week' ? short(st.monday) : t[2]) + '</span></button>';
  }).join('');
  $('main').innerHTML = {week:renderWeek, write:renderWrite, claude:renderClaude, ready:renderReady}[st.view]();
}

function cardHtml(p){
  if (p.auto) return '<div class="card auto"><span class="k">Auto · ' + esc(p.Kind) + '</span><br>' + esc(p.Title) + '<br><span class="meta" style="font-size:11px">Claude builds it on the day</span></div>';
  var sg = stage(p);
  return '<button class="card" data-open="' + esc(p.id) + '"><span class="k">' + esc(p.Kind || 'Post') + (p.Account === 'LinkedIn' ? ' · LinkedIn' : '') + '</span><br>' + esc(p.Title) + '<br>' + badge(sg) + '</button>';
}
function renderWeek(){
  var mon = st.monday, posts = live();
  var h = '<div class="row between" style="margin-top:14px"><span class="lab">' + short(mon) + ' – ' + short(add(mon, 6)) + '</span><div class="row"><button class="btn sm" data-wk="-1">‹ Prev</button><button class="btn sm" data-wk="0">This week</button><button class="btn sm" data-wk="1">Next ›</button></div></div>';
  for (var o = 0; o < 7; o++){
    var d = add(mon, o);
    var its = posts.filter(function(p){ return p.Date === d; });
    var s = autos(d).concat(its.filter(function(p){ return brand(p) === 's'; }));
    var r = its.filter(function(p){ return brand(p) === 'r'; });
    h += '<div class="day' + (d === today() ? ' today' : '') + (d < today() ? ' past' : '') + '"><div class="row between"><b>' + fmt(d) + '</b>' + (d === today() ? '<span class="lab">Today</span>' : '') + '</div>' +
      '<div class="lanes"><div class="lane s"><div class="lh">Sortd</div>' + (s.length ? s.map(cardHtml).join('') : '<div class="empty">Nothing</div>') + '</div>' +
      '<div class="lane r"><div class="lh">Rach Hannon</div>' + (r.length ? r.map(cardHtml).join('') : '<div class="empty">Nothing</div>') + '</div></div></div>';
  }
  return h;
}

function grouped(list, fn){
  var t = today(), wkEnd = add(mondayOf(t), 6), nxEnd = add(wkEnd, 7), h = '', last = null;
  list.forEach(function(p){
    var g = p.Date < t ? 'Overdue' : p.Date <= wkEnd ? 'This week' : p.Date <= nxEnd ? 'Next week' : 'Later';
    if (g !== last){ h += '<div class="grp">' + g + '</div>'; last = g; }
    h += fn(p);
  });
  return h;
}
function head(p){
  return '<div class="row between"><span class="lab">' + esc(accLabel(p)) + ' · ' + esc(p.Kind || 'Post') + '</span><span class="lab">' + fmt(p.Date) + ' · ' + when(p.Date) + '</span></div>' +
    '<div style="font-size:17px;font-weight:700;margin-top:4px">' + esc(p.Title) + '</div>' + (p.Hook ? '<div class="meta" style="margin-top:3px">Hook: ' + esc(p.Hook) + '</div>' : '');
}
function renderWrite(){
  var list = inStage('write').concat(inStage('film')).sort(byDate);
  var h = '<div class="panel"><b>Write the rough version. I do the rest.</b><div class="meta" style="margin-top:4px">Bullet points, a voice note pasted in, half a sentence: all fine. Hit <b>Send to Claude</b> and I\'ll polish it into the caption, or build the carousel slides, in your brand.</div></div>';
  if (!list.length) return h + '<div class="panel">Nothing to write. 🎉</div>';
  return h + grouped(list, function(p){
    var b = brand(p), sg = stage(p);
    return '<div class="item ' + b + '">' + head(p) + '<div style="margin-top:6px">' + badge(sg) + '</div>' +
      (p.Brief ? '<div class="box" style="font-size:13px">' + esc(p.Brief) + '</div>' : '') +
      (sg === 'film' ? '<div class="meta" style="margin-top:8px">This one\'s scripted. Film it, then send the clips to Claude.</div><div class="row" style="margin-top:8px"><button class="btn sm" data-open="' + esc(p.id) + '">See script</button><button class="btn sm go" data-filmed="' + esc(p.id) + '">Filmed: send to Claude</button></div>' :
       '<textarea id="mc-' + esc(p.id) + '" placeholder="Your rough copy for this ' + esc((p.Kind || 'post').toLowerCase()) + '" style="margin-top:8px">' + esc(p['My copy'] || '') + '</textarea>' +
       '<div class="row" style="margin-top:8px"><button class="btn go" data-send="' + esc(p.id) + '">Send to Claude</button><button class="btn" data-draft="' + esc(p.id) + '">Save draft</button></div>') +
      '</div>';
  });
}
function renderClaude(){
  var list = inStage('claude');
  var h = '<div class="panel"><b>Waiting for me to polish or build.</b><div class="meta" style="margin-top:4px">Open the Sortd Social project in Claude and say <b>"build my posts"</b>. I\'ll pick up everything here, write the final copy or make the carousel, and move it to Ready.</div><div class="row" style="margin-top:8px"><button class="btn sm" data-cp-ask>Copy "build my posts"</button></div></div>';
  if (!list.length) return h + '<div class="panel">Nothing waiting.</div>';
  return h + grouped(list, function(p){
    return '<div class="item ' + brand(p) + '">' + head(p) + '<div style="margin-top:6px">' + badge('claude') + '</div>' +
      (p['My copy'] ? '<div class="lab" style="margin-top:10px">Your copy</div><div class="box">' + esc(p['My copy']) + '</div>' : '<div class="meta" style="margin-top:8px">' + (p.Status === 'Filmed' ? 'Filmed: clips to edit.' : 'Copy already in the brief.') + '</div>') +
      '<div class="row" style="margin-top:8px"><button class="btn sm" data-open="' + esc(p.id) + '">Open</button><button class="btn sm" data-back="' + esc(p.id) + '">Take it back to edit</button></div></div>';
  });
}
function renderReady(){
  var list = inStage('ready');
  var h = '<div class="panel"><b>Built and ready to go out.</b><div class="meta" style="margin-top:4px">Open one to copy the caption and hashtags, run the checks, then mark it posted.</div></div>';
  if (!list.length) return h + '<div class="panel">Nothing ready yet.</div>';
  return h + grouped(list, function(p){
    return '<div class="item ' + brand(p) + '">' + head(p) + '<div style="margin-top:6px">' + badge('ready') + '</div><div class="row" style="margin-top:8px"><button class="btn sm go" data-open="' + esc(p.id) + '">Open to post</button></div></div>';
  });
}

// ---------- post sheet ----------
function sec(p, field, label, canCopy){
  if (!p[field]) return '';
  return '<div class="row between" style="margin-top:14px"><span class="lab">' + label + '</span>' + (canCopy ? '<button class="btn sm" data-cp="' + esc(field) + '">Copy</button>' : '') + '</div><div class="box">' + esc(p[field]) + '</div>';
}
function openSheet(){
  var p = find(st.open);
  if (!p){ $('sheet').classList.add('hidden'); return; }
  var sg = stage(p), h = '<div class="row between"><span class="lab">' + esc(accLabel(p)) + ' · ' + esc(p.Kind || 'Post') + '</span><button class="btn sm" data-close>Close</button></div>' +
    '<div style="font-size:20px;font-weight:800;margin-top:6px;letter-spacing:-.02em">' + esc(p.Title) + '</div>' +
    '<div class="row" style="margin-top:6px"><span class="meta">' + (p.Date ? fmt(p.Date) + ' · ' + when(p.Date) : 'No date') + '</span>' + badge(sg) + '</div>';
  if (sg === 'write'){
    h += sec(p, 'Brief', 'Brief') + sec(p, 'Hook', 'Hook') +
      '<div class="lab" style="margin-top:14px">Your copy</div><textarea id="mc-' + esc(p.id) + '" style="margin-top:6px" placeholder="Rough is fine">' + esc(p['My copy'] || '') + '</textarea>' +
      '<div class="row" style="margin-top:8px"><button class="btn go" data-send="' + esc(p.id) + '">Send to Claude</button><button class="btn" data-draft="' + esc(p.id) + '">Save draft</button></div>';
  } else if (sg === 'film'){
    h += sec(p, 'Shot list', 'Script') + sec(p, 'B-roll needed', 'B-roll') + '<div class="row" style="margin-top:12px"><button class="btn go" data-filmed="' + esc(p.id) + '">Filmed: send to Claude</button></div>';
  } else if (sg === 'claude'){
    h += sec(p, 'My copy', 'Your copy') + sec(p, 'Brief', 'Brief') + '<div class="panel">With Claude. Say <b>"build my posts"</b> in the Sortd Social project.</div><div class="row" style="margin-top:8px"><button class="btn" data-back="' + esc(p.id) + '">Take it back to edit</button></div>';
  } else {
    h += sec(p, 'Caption', 'Caption', true) + sec(p, 'Hashtags', 'Hashtags', true) + sec(p, 'Alt text', 'Alt text', true) + sec(p, 'Brief', 'Where the files are');
    var cl = String(p.Checks || '').split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
    if (cl.length) h += '<div class="lab" style="margin-top:14px">Before posting</div>' + cl.map(function(c, k){ var key = p.id + '-' + k, on = !!st.checks[key]; return '<label class="chk"><input type="checkbox" data-chk="' + esc(key) + '"' + (on ? ' checked' : '') + '><span style="' + (on ? 'text-decoration:line-through;opacity:.5' : '') + '">' + esc(c) + '</span></label>'; }).join('');
    if (sg === 'ready') h += '<div class="lab" style="margin-top:14px">Posted it?</div><input type="url" id="plink" placeholder="Paste the post link (optional)" value="' + esc(p['Post link'] || '') + '" style="margin-top:6px"><div class="row" style="margin-top:8px"><button class="btn go" data-posted="' + esc(p.id) + '">Mark posted</button></div>';
    else if (p['Post link']) h += '<div style="margin-top:12px"><a href="' + esc(p['Post link']) + '" target="_blank" rel="noopener">View the post →</a></div>';
  }
  h += '<div class="lab" style="margin-top:20px">Move it</div><div class="row" style="margin-top:6px"><input type="date" id="pdate" value="' + esc(p.Date || '') + '" style="width:auto"><button class="btn sm" data-move="' + esc(p.id) + '">Save date</button><button class="btn sm" data-skip="' + esc(p.id) + '">Skip this post</button></div>';
  $('sheetin').innerHTML = h;
  $('sheet').classList.remove('hidden');
}

// ---------- writes ----------
function save(id, fields, msg){
  return api('updatePost', {id:id, fields:fields}).then(function(r){
    DATA.posts = DATA.posts.map(function(p){ return p.id === id ? r.post : p; });
    render(); if (st.open) openSheet(); toast(msg || 'Saved');
  }).catch(function(e){ toast(e.message); });
}
function copyOf(id){ var t = $('mc-' + id); return t ? t.value.trim() : ''; }

document.addEventListener('click', function(e){
  var t = e.target.closest('button, #sheet'); if (!t) return;
  if (t.id === 'sheet'){ if (e.target === t){ st.open = null; t.classList.add('hidden'); } return; }
  var ds = t.dataset;
  if (t.id === 'pwgo') return login();
  if (t.id === 'logout'){ store.del('cc_pw'); pw = ''; $('app').classList.add('hidden'); $('login').classList.remove('hidden'); return; }
  if (t.id === 'refresh') return load(true);
  if (ds.v){ st.view = ds.v; window.scrollTo(0, 0); return render(); }
  if (ds.wk !== undefined){ var n = +ds.wk; st.monday = n === 0 ? mondayOf(today()) : add(st.monday, 7 * n); return render(); }
  if (ds.open){ st.open = ds.open; return openSheet(); }
  if (ds.close !== undefined){ st.open = null; $('sheet').classList.add('hidden'); return; }
  if (ds.cpAsk !== undefined) return copy('build my posts', 'Prompt');
  if (ds.cp){ var cp = find(st.open); return copy(cp[ds.cp] || '', ds.cp); }
  if (ds.send){ var v = copyOf(ds.send); if (!v){ toast('Write something first'); return; } t.disabled = true; return save(ds.send, {'My copy': v, Status: 'With Claude'}, 'Sent to Claude'); }
  if (ds.draft){ t.disabled = true; return save(ds.draft, {'My copy': copyOf(ds.draft) || null}, 'Draft saved').then(function(){ t.disabled = false; }); }
  if (ds.filmed){ t.disabled = true; return save(ds.filmed, {Status: 'Filmed'}, 'Sent to Claude to edit'); }
  if (ds.back){ return save(ds.back, {Status: 'Planned'}, 'Back in To write'); }
  if (ds.posted){ return save(ds.posted, {Status: 'Posted', 'Post link': ($('plink') && $('plink').value.trim()) || null}, 'Marked posted'); }
  if (ds.move){ var nd = $('pdate').value; if (!nd){ toast('Pick a date'); return; } return save(ds.move, {Date: nd}, 'Moved to ' + fmt(nd)); }
  if (ds.skip){ st.open = null; $('sheet').classList.add('hidden'); return save(ds.skip, {Status: 'Skipped'}, 'Skipped'); }
});
document.addEventListener('change', function(e){
  var k = e.target.dataset && e.target.dataset.chk;
  if (k){ st.checks[k] = e.target.checked; store.set('cc_checks2', JSON.stringify(st.checks)); openSheet(); }
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && st.open){ st.open = null; $('sheet').classList.add('hidden'); } });
$('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') login(); });
$('pw').addEventListener('input', function(){ $('pwerr').textContent = ''; });

function load(manual){
  return api('load').then(function(r){
    DATA = r;
    if (!st.monday) st.monday = mondayOf(today());
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    render(); if (manual) toast('Up to date');
  }).catch(function(e){
    if (e.status === 401){ store.del('cc_pw'); pw = ''; $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('pwerr').textContent = 'Wrong password. Try again.'; }
    else { $('login').classList.remove('hidden'); $('pwerr').textContent = e.message; toast(e.message); }
    throw e;
  });
}
function login(){
  var v = $('pw').value.trim(); if (!v){ $('pwerr').textContent = 'Enter the password'; return; }
  pw = v; $('pwgo').disabled = true;
  load().then(function(){ store.set('cc_pw', pw); }).catch(function(){}).then(function(){ $('pwgo').disabled = false; });
}
if (pw) load().catch(function(){});
})();
</script>
</body>
