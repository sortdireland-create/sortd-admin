<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFDF6">
<title>Content calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,800&display=swap" rel="stylesheet">
<style>
/* Rach Hannon brand: Lilac & Navy (v2.0). Cream carries the surface; lanes: AI Stack = Navy, Brand Playbook = Lilac, Working Notes = Buttermilk. No black. Cherry = one detail only. */
:root{--cream:#FFFDF6;--navy:#1F2347;--lilac:#D9CCF5;--butter:#FFF1C2;--slate:#4A4E6E;--cherry:#C8243A;--line:#E7E2F2;--soft:#F6F2FC;--sortd:#4782A8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--navy);font-family:'DM Sans',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:20px 20px 80px;max-width:1180px;margin:0 auto}
.bd{font-weight:800;letter-spacing:-.03em}
.lab{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--slate)}
.meta{font-size:12px;color:var(--slate)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
button{font-family:inherit;cursor:pointer}
.pill{font-size:13px;font-weight:500;padding:6px 13px;border-radius:999px;border:1px solid var(--line);color:var(--navy);background:#fff}
.pill.on{background:var(--navy);color:var(--butter);border-color:var(--navy)}
.btn{font-size:13px;font-weight:500;border:1px solid var(--navy);border-radius:8px;padding:6px 12px;background:#fff;color:var(--navy)}
.btn.red{background:var(--navy);color:var(--butter);border-color:var(--navy)}
.btn:disabled{opacity:.5}
.tabs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;margin-top:14px}
.tabs .pill{white-space:nowrap}
.nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:14px}
.nav button{font-size:14px;font-weight:600;padding:11px 6px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--navy);line-height:1.2}
.nav button .n{display:block;font-size:11px;font-weight:500;color:var(--slate);margin-top:2px}
.nav button.on{background:var(--navy);color:var(--butter);border-color:var(--navy)}
.nav button.on .n{color:var(--lilac)}
.nav button[data-v=AI].on{background:var(--navy);color:var(--butter)}
.nav button[data-v=BP].on{background:var(--lilac);color:var(--navy);border-color:var(--navy)}
.nav button[data-v=BP].on .n,.nav button[data-v=WN].on .n,.nav button[data-v=broll].on .n{color:var(--slate)}
.nav button[data-v=WN].on{background:var(--butter);color:var(--navy);border-color:var(--navy)}
.nav button[data-v=broll].on{background:var(--butter);color:var(--navy);border-color:var(--navy)}
.sub{display:flex;gap:16px;margin-top:10px;font-size:13px}
.sub button{background:none;border:0;padding:4px 0;color:var(--slate);font-size:13px;font-weight:500}
.sub button.on{color:var(--navy);font-weight:700;box-shadow:inset 0 -2px 0 var(--navy)}
.li-row{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:6px;color:var(--navy);font-size:14px}
.li-row.sel{box-shadow:0 0 0 2px var(--navy)}
.li-row .dt{flex:none;width:58px;font-size:12px;font-weight:600;color:var(--slate)}
.li-row .hk{font-size:13px;color:var(--slate);margin-top:2px}
.tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 6px;background:var(--soft);color:var(--slate);margin-left:4px}
.tag.posted{background:var(--navy);color:var(--butter)}
.script{background:#fff;border-radius:12px;padding:14px;margin-top:10px;border-left:6px solid var(--line)}
.script.AIb{border-left-color:var(--navy)}.script.BPb{border-left-color:var(--lilac)}.script.WNb{border-left-color:#F0DE9A}
@media (max-width:760px){.nav{grid-template-columns:repeat(3,minmax(0,1fr))}}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
.col{background:var(--soft);border-radius:10px;padding:7px;min-height:140px}
.col.shoot{box-shadow:inset 0 0 0 1.5px var(--navy)}
.col.today .lab::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cherry);margin-left:6px;vertical-align:1px}
.c{font-size:12px;line-height:1.35;border-radius:8px;padding:7px;margin-top:6px;text-align:left;width:100%;display:block}
.c.sel{box-shadow:0 0 0 2px var(--navy)}
.AI{background:var(--navy);color:var(--butter);border:0}
.AI b{color:var(--lilac)}
.BP{background:var(--lilac);color:var(--navy);border:0}
.WN{background:var(--butter);color:var(--navy);border:0}
.WN b{color:var(--slate)}
.ST{background:#fff;border:1.5px solid var(--navy);color:var(--navy)}
.SD{background:#fff;color:var(--navy);border:1.5px solid var(--sortd)}
.AUTO{border:1px dashed var(--sortd);color:var(--slate);background:#fff}
.TASK{background:#fff;color:var(--slate);border:1px solid var(--line)}
.LI{background:#fff;color:var(--navy);border:1px solid var(--lilac)}
.SUB{background:#fff;color:var(--navy);border:1px solid #F0DE9A}
.IDEA{background:#fff;border:1px dashed var(--lilac);color:var(--navy)}
.done{opacity:.45;text-decoration:line-through}
.f2c{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;background:var(--lilac);color:var(--navy);border-radius:4px;padding:1px 5px;margin-bottom:3px}
.AI .f2c{background:var(--butter)}
.BP .f2c{background:#fff}
.ban{font-size:11px;font-weight:600;letter-spacing:.04em;text-align:center;border-radius:6px;padding:4px;margin-top:5px;border:0;width:100%}
.ban.shootban{background:var(--navy);color:var(--butter)}
.ban.brollban{background:var(--butter);color:var(--navy)}
.panel{background:var(--soft);border-radius:12px;padding:16px;margin-top:14px}
.panel.dark{background:var(--navy);color:var(--butter)}
.panel.dark .lab{color:var(--lilac)}
.box{background:#fff;border-radius:8px;padding:10px;font-size:13px;line-height:1.55;margin-top:6px;white-space:pre-wrap;word-wrap:break-word}
textarea,input[type=text],input[type=url],input[type=password],input[type=date],select{width:100%;font-family:inherit;font-size:15px;border-radius:8px;border:1px solid var(--line);padding:9px;background:#fff;color:var(--navy)}
textarea{min-height:110px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.chk input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--navy)}
.grp{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);margin-top:16px}
.late{color:var(--cherry)}
.err{font-size:13px;color:var(--cherry);min-height:16px;margin-top:4px}
table.ov{width:100%;border-collapse:collapse;font-size:13px}
table.ov td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:6px;gap:2px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:9;pointer-events:none}
#toast span{background:var(--navy);color:var(--butter);padding:8px 14px;border-radius:999px;font-size:13px}
#login{max-width:360px;margin:12vh auto 0}
.hidden{display:none!important}
@media (max-width:760px){
  body{padding:14px 14px 80px}
  .grid{grid-template-columns:1fr}
  .col{min-height:0}
  .col.empty{display:none}
  .c{font-size:14px;padding:10px}
}
</style>
</head>
<body>

<div id="login" class="panel">
  <div class="bd" style="font-size:22px">Content calendar</div>
  <div class="meta" style="margin:6px 0 12px">Same password as the Sortd admin page.</div>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
  <div class="err" id="pwerr"></div>
  <button class="btn red" id="pwgo" style="margin-top:6px">Open</button>
</div>

<div id="app" class="hidden">
  <div class="row between">
    <span class="bd" style="font-size:22px">Content calendar</span>
    <div class="row"><button class="btn" id="refresh">Refresh</button><button class="btn" id="logout">Log out</button></div>
  </div>
  <div class="nav" id="tabs"></div>
  <div class="sub" id="subnav"></div>
  <div class="row between" style="margin-top:10px" id="wkbar"></div>
  <div id="main"></div>
  <div id="detail"></div>
</div>
<div id="toast"></div>

<script>
(function(){
'use strict';
var START = '2026-11-09', WEEKS = 12;
var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], D = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var PN = {AI:'THE AI STACK', WN:'WORKING NOTES', BP:'THE BRAND PLAYBOOK', ST:'START HERE'};
var PILLAR_KEY = {'THE AI STACK':'AI','WORKING NOTES':'WN','THE BRAND PLAYBOOK':'BP','START HERE':'ST'};
var STEPS = ['Idea','Planned','Scripted','Filmed','Edited','Ready','Posted'];
var EDITABLE = ['Hook','Brief','Shot list','B-roll needed','Caption','Hashtags','Alt text','Ends on','Checks'];

var store = {
  get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del: function(k){ try { localStorage.removeItem(k); } catch(e){} }
};
var pw = store.get('cc_pw') || '';
var DATA = {posts:[], broll:[], notes:[], suggestions:[], today: null};
var st = {view:'cal', cal:'week', w:1, sf:'todo', sg:'post', sel:null, bf:'todo', editing:null, shots: JSON.parse(store.get('cc_shots') || '{}')};

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ms(d){ return Date.parse(d + 'T12:00:00Z'); }
function iso(t){ return new Date(t).toISOString().slice(0,10); }
function add(d, n){ return iso(ms(d) + n*864e5); }
function wkStart(w){ return add(START, (w-1)*7); }
function weekOf(d){ return Math.floor((ms(d) - ms(START)) / (7*864e5)) + 1; }
function fmt(d){ var x = new Date(ms(d)); return D[x.getUTCDay()] + ' ' + x.getUTCDate() + ' ' + M[x.getUTCMonth()]; }
function short(d){ var x = new Date(ms(d)); return x.getUTCDate() + ' ' + M[x.getUTCMonth()]; }
function today(){ return DATA.today || iso(Date.now()); }
function thisWeek(){ return Math.min(WEEKS, Math.max(1, weekOf(today()))); }

var tt;
function toast(t){ $('toast').innerHTML = '<span>' + esc(t) + '</span>'; clearTimeout(tt); tt = setTimeout(function(){ $('toast').innerHTML = ''; }, 2200); }

function api(action, extra){
  var body = Object.assign({password: pw, action: action}, extra || {});
  return fetch('/.netlify/functions/content', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body)})
    .then(function(r){ return r.json().catch(function(){ return {error:'Bad response'}; }).then(function(j){ if (!r.ok) { var e = new Error(j.error || ('Error ' + r.status)); e.status = r.status; throw e; } return j; }); });
}

function copy(text, label){
  var done = function(){ toast(label + ' copied'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  function fallback(){ var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch(e){ toast('Copy failed'); } document.body.removeChild(t); }
}

// ---------- shaping the data ----------
function norm(p){
  var kind = p.Kind || 'Post', acc;
  if (kind === 'Task') acc = 'task';
  else if (p.Account === 'Sortd') acc = 'sortd';
  else if (p.Account === 'LinkedIn') acc = 'li';
  else if (p.Account === 'Working Notes') acc = 'wn';
  else acc = 'rach';
  return {id:p.id, raw:p, title:p.Title || '(untitled)', date:p.Date || null, film:p['Film day'] || null, acc:acc, kind:kind,
    series: PILLAR_KEY[p.Pillar] || null, pillar:p.Pillar || '', status:p.Status || 'Planned', no:p['No.'] || null,
    shots:p['Shot list'] || '', link:p['Post link'] || ''};
}
function posts(){ return DATA.posts.map(norm); }
function scheduled(){ return posts().filter(function(i){ return i.date && i.status !== 'Idea'; }); }
function ideas(){ return posts().filter(function(i){ return !i.date || i.status === 'Idea'; }); }
function automations(w){
  var out = [];
  [[0,'New listings roundup'],[1,'Provider spotlight'],[3,'New listings roundup'],[4,'Provider spotlight']].forEach(function(a){
    out.push({id:'auto-'+w+'-'+a[0], auto:true, acc:'auto', kind:'Carousel', title:'Auto · ' + a[1], date: add(wkStart(w), a[0]), status:'Planned'});
  });
  out.push({id:'rev-'+w, auto:true, acc:'review', kind:'Review', title:'Sunday notes in by 9:30pm · review 9:45pm', date: add(wkStart(w), 6), status:'Planned'});
  return out;
}
function isF2C(i){ return /to camera/i.test(i.shots || ''); }
function cls(i){
  if (i.acc === 'auto') return 'AUTO';
  if (i.acc === 'review' || i.acc === 'task') return 'TASK';
  if (i.acc === 'sortd') return 'SD';
  if (i.acc === 'li') return 'LI';
  if (i.acc === 'wn') return 'SUB';
  return i.series || 'TASK';
}
function plabel(i){ if (i.series === 'WN' && i.no) return 'WORKING NOTES · No. ' + ('0' + i.no).slice(-2); return PN[i.series] || ''; }

// ---------- rendering ----------
var MAIN = [['cal','Calendar'],['AI','AI Stack'],['WN','Working Notes'],['BP','Brand Playbook'],['broll','B-roll'],['scripts','Scripts']];
var MORE = [['ideas','Ideas'],['notes','Sunday notes'],['sug','Suggestions']];
var FILMED = ['Filmed','Edited','Ready','Posted'];

function pillarPosts(k){ return scheduled().filter(function(i){ return i.acc === 'rach' && i.series === k; }).sort(function(a, b){ return a.date < b.date ? -1 : 1; }); }
function scriptPosts(){
  return scheduled().filter(function(i){ return i.shots && i.acc !== 'task'; })
    .filter(function(i){ var f = FILMED.indexOf(i.status) >= 0; return st.sf === 'all' ? true : st.sf === 'done' ? f : !f; })
    .sort(function(a, b){ return a.date < b.date ? -1 : 1; });
}
function toFilm(){ return scheduled().filter(function(i){ return i.shots && i.acc !== 'task' && FILMED.indexOf(i.status) < 0; }).length; }

function card(i){
  var kindTxt = (i.status === 'Idea' && !i.raw.Kind) ? '' : ' · ' + esc(i.kind);
  var pre = i.acc === 'rach' ? '<b>' + esc(plabel(i) || 'Idea') + '</b>' + kindTxt + '<br>' : i.acc === 'sortd' ? 'Sortd ' + esc(i.kind) + ' · ' : (i.acc === 'li' && !/^linkedin/i.test(i.title)) ? 'LinkedIn · ' : '';
  var f2 = (i.acc === 'rach' && isF2C(i)) ? '<span class="f2c">TO CAMERA</span><br>' : '';
  var dn = (i.status === 'Posted' || i.status === 'Done') ? ' done' : '';
  return '<button class="c ' + cls(i) + (st.sel === i.id ? ' sel' : '') + dn + '" data-id="' + esc(i.id) + '">' + f2 + pre + esc(i.title) + '</button>';
}

function pl(n){ return n + (n === 1 ? ' post' : ' posts'); }
function render(){
  var pending = DATA.suggestions.filter(function(s){ return (s.Status || 'Pending') === 'Pending' && s.Type !== 'Weekly summary'; }).length;
  var toGet = DATA.broll.filter(function(b){ return !b['Got it']; }).length;
  var n = {cal: 'Week ' + st.w, AI: pl(pillarPosts('AI').length), WN: pl(pillarPosts('WN').length), BP: pl(pillarPosts('BP').length), broll: toGet + ' to get', scripts: toFilm() + ' to film'};
  $('tabs').innerHTML = MAIN.map(function(v){ return '<button class="' + (st.view === v[0] ? 'on' : '') + '" data-v="' + v[0] + '">' + v[1] + '<span class="n">' + n[v[0]] + '</span></button>'; }).join('');
  var m = {ideas: ideas().length, sug: pending};
  $('subnav').innerHTML = MORE.map(function(v){ return '<button class="' + (st.view === v[0] ? 'on' : '') + '" data-v="' + v[0] + '">' + v[1] + (m[v[0]] ? ' · ' + m[v[0]] : '') + '</button>'; }).join('');
  var ws = wkStart(st.w), we = add(ws, 6);
  $('wkbar').innerHTML = st.view === 'cal' ? '<div class="row">' + [['week','Week'],['ov','All 12 weeks']].map(function(x){ return '<button class="pill' + (st.cal === x[0] ? ' on' : '') + '" data-cal="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>' +
    (st.cal === 'week' ? '<div class="row"><span class="lab" style="margin-right:6px">' + short(ws) + ' – ' + short(we) + '</span><button class="btn" data-n="-1">‹</button><button class="btn" data-n="0">Today</button><button class="btn" data-n="1">›</button></div>' : '') : '';
  var fn = {cal: st.cal === 'week' ? renderWeek : renderOverview, AI:renderPillar, WN:renderPillar, BP:renderPillar, broll:renderBroll, scripts:renderScripts, ideas:renderIdeas, notes:renderNotes, sug:renderSug}[st.view];
  $('main').innerHTML = fn();
  renderDetail();
}

function renderPillar(){
  var k = st.view, list = pillarPosts(k), ids = ideas().filter(function(i){ return i.series === k; });
  var lead = {AI:'Here\'s how I built it. Navy cover, Buttermilk text.', WN:'Here\'s what happened. Buttermilk box, numbered No. 01.', BP:'Do this for your brand. Block Lilac, no photos.'}[k];
  var cur = null, h = '<div class="panel ' + (k === 'AI' ? 'dark' : '') + '" style="' + (k === 'BP' ? 'background:var(--lilac)' : k === 'WN' ? 'background:var(--butter)' : '') + '"><div class="lab">' + PN[k] + '</div><div class="bd" style="font-size:18px;margin-top:4px">' + list.length + ' posts over 12 weeks</div><div style="font-size:13px;margin-top:4px;opacity:.85">' + lead + '</div></div>';
  list.forEach(function(i){
    var w = weekOf(i.date);
    if (w !== cur){ cur = w; h += '<div class="grp">Week ' + w + ' · ' + short(wkStart(w)) + '</div>'; }
    var posted = i.status === 'Posted';
    h += '<button class="li-row' + (st.sel === i.id ? ' sel' : '') + '" data-id="' + esc(i.id) + '"><span class="dt">' + fmt(i.date).replace(' ', '<br>') + '</span><span style="flex:1"><b>' + esc(i.title) + '</b><span class="tag">' + esc(i.kind) + '</span>' + (isF2C(i) ? '<span class="tag">To camera</span>' : '') + '<span class="tag' + (posted ? ' posted' : '') + '">' + esc(i.status) + '</span>' + (i.raw.Hook ? '<div class="hk">' + esc(i.raw.Hook) + '</div>' : '') + '</span></button>';
  });
  if (!list.length) h += '<div class="panel"><div class="meta">Nothing scheduled in this pillar yet.</div></div>';
  if (ids.length) h += '<div class="grp">Ideas for this pillar · ' + ids.length + '</div>' + ids.map(card).join('');
  return h;
}

function scriptText(list){
  return list.map(function(i){
    return i.title.toUpperCase() + '\nPosts ' + fmt(i.date) + (i.film ? ' · film ' + fmt(i.film) : '') +
      (i.raw.Hook ? '\n\nHook: ' + i.raw.Hook : '') + '\n\n' + i.shots + (i.raw['Ends on'] ? '\n\nEnds on: ' + i.raw['Ends on'] : '');
  }).join('\n\n---\n\n');
}
function shotLine(i, s, k){
  var key = i.id + '-' + k, on = !!st.shots[key];
  return '<div class="chk" data-shot="' + esc(key) + '"><input type="checkbox"' + (on ? ' checked' : '') + '><div><span class="' + (on ? 'done' : '') + '">' + esc(s) + '</span>' + (st.sg === 'type' ? '<div class="meta">' + esc(i.title) + ' · posts ' + short(i.date) + '</div>' : '') + '</div></div>';
}
function renderScripts(){
  var list = scriptPosts();
  var h = '<div class="panel"><div class="row between"><span class="bd" style="font-size:18px">Scripts · ' + list.length + '</span><div class="row"><button class="btn red" id="sshare">Send to notes</button><button class="btn" id="scopy">Copy all</button></div></div>' +
    '<div class="meta" style="margin-top:4px">White or plain tee, light denim · natural window light · rear camera, exposure locked · the red cap is the one Cherry detail. Keep API keys, Airtable IDs, emails and WhatsApp names off camera.</div>' +
    '<div class="row between" style="margin-top:10px"><div class="row">' + [['todo','To film'],['done','Filmed'],['all','All']].map(function(x){ return '<button class="pill' + (st.sf === x[0] ? ' on' : '') + '" data-sf="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>' +
    '<div class="row">' + [['post','By post'],['type','By shot type']].map(function(x){ return '<button class="pill' + (st.sg === x[0] ? ' on' : '') + '" data-sg="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div></div></div>';
  if (!list.length) return h + '<div class="panel"><div class="meta">' + (st.sf === 'todo' ? 'Everything is filmed.' : 'Nothing here yet.') + '</div></div>';
  if (st.sg === 'type'){
    var all = [];
    list.forEach(function(i){ i.shots.split('\n').filter(Boolean).forEach(function(s, k){ all.push({i:i, s:s, k:k}); }); });
    [['Face to camera · back to back, same outfit and light', 0], ['Screen recordings', 1], ['Hands, doorway and the rest', 2]].forEach(function(g){
      var xs = all.filter(function(x){ return shotGroup(x.s) === g[1]; });
      if (xs.length) h += '<div class="panel"><div class="grp" style="margin-top:0">' + g[0] + ' · ' + xs.length + '</div>' + xs.map(function(x){ return shotLine(x.i, x.s, x.k); }).join('') + '</div>';
    });
    return h;
  }
  list.forEach(function(i){
    var filmed = FILMED.indexOf(i.status) >= 0;
    h += '<div class="script ' + (i.series ? i.series + 'b' : '') + '"><div class="row between"><span class="lab">' + esc(i.acc === 'rach' ? (plabel(i) || '@rach.hannon') : i.acc === 'sortd' ? 'Sortd' : i.acc) + ' · ' + esc(i.kind) + ' · posts ' + fmt(i.date) + '</span><span class="tag' + (filmed ? ' posted' : '') + '">' + esc(i.status) + '</span></div>' +
      '<div class="bd" style="font-size:17px;margin-top:4px">' + esc(i.title) + '</div>' +
      (i.raw.Hook ? '<div class="box" style="background:var(--soft)"><span class="lab">Hook</span>\n' + esc(i.raw.Hook) + '</div>' : '') +
      i.shots.split('\n').filter(Boolean).map(function(s, k){ return shotLine(i, s, k); }).join('') +
      (i.raw['Ends on'] ? '<div class="meta" style="margin-top:8px"><b>Ends on:</b> ' + esc(i.raw['Ends on']) + '</div>' : '') +
      '<div class="row" style="margin-top:10px">' + (filmed ? '' : '<button class="btn red" data-filmed="' + esc(i.id) + '">Mark filmed</button>') + '<button class="btn" data-id="' + esc(i.id) + '">Open post</button></div></div>';
  });
  return h;
}

function renderWeek(){
  var all = scheduled().concat(automations(st.w)), h = '<div class="grid">';
  for (var o = 0; o < 7; o++){
    var d = add(wkStart(st.w), o);
    var its = all.filter(function(i){ return i.date === d; });
    var extra = (o === 2 ? '<button class="ban shootban" data-v="scripts">Shoot day · scripts</button>' : '') + (o >= 5 ? '<button class="ban brollban" data-v="broll">B-roll</button>' : '');
    h += '<div class="col' + (o === 2 ? ' shoot' : '') + (d === today() ? ' today' : '') + (its.length || extra ? '' : ' empty') + '"><div class="lab">' + fmt(d) + (d === today() ? ' · today' : '') + '</div>' + extra + its.map(card).join('') + '</div>';
  }
  return h + '</div>';
}

function shotGroup(line){
  if (/to camera/i.test(line)) return 0;
  if (/^(screen|poll|end card)/i.test(line)) return 1;
  return 2;
}
function brollLine(b){
  var post = b.Post && b.Post[0] ? DATA.posts.filter(function(p){ return p.id === b.Post[0]; })[0] : null;
  var late = b['Need by'] && b['Need by'] < today() && !b['Got it'];
  return '<div class="chk" data-b="' + esc(b.id) + '"><input type="checkbox"' + (b['Got it'] ? ' checked' : '') + '><div><span class="' + (b['Got it'] ? 'done' : '') + '">' + esc(b.Shot) + '</span><div class="meta' + (late ? ' late' : '') + '">' + (b['Need by'] ? 'Need by ' + fmt(b['Need by']) : 'Any weekend') + (post ? ' · ' + esc(post.Title) : '') + '</div></div></div>';
}
function brollText(){
  var todo = DATA.broll.filter(function(b){ return !b['Got it']; }).sort(function(a, c){ return (a['Need by'] || '9') < (c['Need by'] || '9') ? -1 : 1; });
  return 'B-roll to get\n\n' + todo.map(function(b){ return b.Shot + (b['Need by'] ? ' (by ' + short(b['Need by']) + ')' : ''); }).join('\n');
}
function renderBroll(){
  var list = DATA.broll.filter(function(b){ return st.bf === 'todo' ? !b['Got it'] : st.bf === 'got' ? !!b['Got it'] : true; });
  var soon = list.filter(function(b){ return b['Need by']; }).sort(function(a, c){ return a['Need by'] < c['Need by'] ? -1 : 1; });
  var any = list.filter(function(b){ return !b['Need by']; });
  return '<div class="panel"><div class="row between"><span class="bd" style="font-size:18px">B-roll</span><div class="row"><button class="btn red" id="share">Send to notes</button><button class="btn" id="cplist">Copy list</button></div></div>' +
    '<div class="meta" style="margin-top:4px">Mostly weekends. Tick it here and it comes off the list. Hands and backs only if the children are in frame.</div>' +
    '<div class="row" style="margin-top:8px">' + [['todo','To get'],['got','Got it'],['all','All']].map(function(x){ return '<button class="pill' + (st.bf === x[0] ? ' on' : '') + '" data-bf="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>' +
    (soon.length ? '<div class="grp">Needed for a post · soonest first</div>' + soon.map(brollLine).join('') : '') +
    (any.length ? '<div class="grp">Generic library · any weekend</div>' + any.map(brollLine).join('') : '') +
    '<div class="row" style="margin-top:14px"><input type="text" id="bnew" placeholder="Rain on the kitchen window" style="flex:1;min-width:160px"><button class="btn" id="badd">Add</button></div><div class="err" id="berr"></div></div>';
}

function renderOverview(){
  var r = scheduled().filter(function(i){ return i.acc === 'rach' && (i.kind === 'Reel' || i.kind === 'Carousel') && i.series && i.series !== 'ST'; });
  var t = r.length || 1, c = function(k){ return r.filter(function(i){ return i.series === k; }).length; };
  var pct = function(k){ return Math.round(c(k) / t * 100); };
  var h = '<div class="panel"><div class="row between"><span class="lab">Pillar mix · ' + r.length + ' posts</span><span class="meta">Target 40 / 30 / 30</span></div>' +
    '<div class="bar"><div style="width:' + pct('AI') + '%;background:var(--navy)"></div><div style="width:' + pct('WN') + '%;background:#F0DE9A"></div><div style="width:' + pct('BP') + '%;background:var(--lilac)"></div></div>' +
    '<div class="row meta" style="margin-top:6px;gap:14px"><span>AI Stack ' + c('AI') + ' (' + pct('AI') + '%)</span><span>Working Notes ' + c('WN') + ' (' + pct('WN') + '%)</span><span>Brand Playbook ' + c('BP') + ' (' + pct('BP') + '%)</span></div></div>';
  h += '<div class="panel"><table class="ov">';
  for (var w = 1; w <= WEEKS; w++){
    var its = scheduled().filter(function(i){ return weekOf(i.date) === w && i.acc === 'rach' && i.kind !== 'Story' && i.kind !== 'Task'; }).sort(function(a, b){ return a.date < b.date ? -1 : 1; });
    h += '<tr data-w="' + w + '" style="cursor:pointer"><td style="width:70px"><b>Wk ' + w + '</b><br><span class="lab">' + short(wkStart(w)) + '</span></td><td>' +
      (its.length ? its.map(function(i){ return '<span class="c ' + cls(i) + '" style="display:inline-block;width:auto;margin:2px">' + esc(i.kind) + ' · ' + esc(i.title) + '</span>'; }).join('') : '<span class="meta">Nothing scheduled</span>') + '</td></tr>';
  }
  return h + '</table></div>';
}

function renderIdeas(){
  var list = ideas();
  var by = {};
  list.forEach(function(i){ var k = i.series || 'Other'; (by[k] = by[k] || []).push(i); });
  var order = ['AI','WN','BP','ST','Other'];
  var h = '<div class="panel"><div class="bd" style="font-size:18px">Ideas</div><div class="meta" style="margin-top:4px">Not on the calendar yet. Open one to give it a date. The Sunday review adds accepted ideas here.</div>';
  order.forEach(function(k){ if (!by[k]) return; h += '<div class="grp">' + (PN[k] || 'No pillar yet') + ' · ' + by[k].length + '</div>' + by[k].map(card).join(''); });
  h += '<div class="grp">Add an idea</div><div class="row" style="margin-top:6px"><input type="text" id="inew" placeholder="The prompt I use for every carousel" style="flex:1;min-width:160px">' +
    '<select id="ipil" class="btn"><option value="THE AI STACK">AI Stack</option><option value="WORKING NOTES">Working Notes</option><option value="THE BRAND PLAYBOOK">Brand Playbook</option></select><button class="btn" id="iadd">Add</button></div><div class="err" id="ierr"></div></div>';
  return h;
}

function renderNotes(){
  return '<div class="panel"><div class="bd" style="font-size:18px">Sunday notes</div><div class="meta" style="margin-top:4px">What you built, what posted, what landed, any numbers. The Sunday review reads everything saved since last Sunday, at 9:45pm.</div>' +
    '<textarea id="nt" placeholder="Shipped the class page redesign. Intro Reel: 3 saves, 1 follow. Parents in the Malahide group asked about Christmas camps." style="margin-top:8px"></textarea><div class="err" id="nerr"></div><button class="btn red" id="nsave">Save notes</button>' +
    DATA.notes.map(function(n){ return '<div class="box"><span class="lab">' + (n.Date ? fmt(n.Date) : '') + (n.Processed ? ' · reviewed' : '') + '</span>\n' + esc(n.Notes) + '</div>'; }).join('') + '</div>';
}

function renderSug(){
  var sum = DATA.suggestions.filter(function(s){ return s.Type === 'Weekly summary'; }).sort(function(a, b){ return (a['Week of'] || '') < (b['Week of'] || '') ? 1 : -1; })[0];
  var rest = DATA.suggestions.filter(function(s){ return s.Type !== 'Weekly summary'; }).sort(function(a, b){
    var pa = (a.Status || 'Pending') === 'Pending' ? 0 : 1, pb = (b.Status || 'Pending') === 'Pending' ? 0 : 1;
    if (pa !== pb) return pa - pb; return (a['Week of'] || '') < (b['Week of'] || '') ? 1 : -1;
  }).slice(0, 40);
  var h = '';
  if (sum) h += '<div class="panel dark"><div class="lab">Weekly summary' + (sum['Week of'] ? ' · ' + fmt(sum['Week of']) : '') + '</div><div style="font-size:14px;margin-top:6px;line-height:1.55;white-space:pre-wrap">' + esc(sum.Proposed || sum.Why || sum.Title) + '</div></div>';
  if (!rest.length) return h + '<div class="panel"><div class="meta">No suggestions yet. The first review runs on Sunday at 9:45pm.</div></div>';
  rest.forEach(function(s){
    var status = s.Status || 'Pending';
    var post = s.Post && s.Post[0] ? DATA.posts.filter(function(p){ return p.id === s.Post[0]; })[0] : null;
    h += '<div class="panel" style="' + (status !== 'Pending' ? 'opacity:.55' : '') + '"><div class="row between"><b style="font-size:14px">' + esc(s.Title) + '</b><span class="lab">' + esc(s.Type || '') + ' · ' + esc(status) + '</span></div>' +
      (post ? '<div class="meta" style="margin-top:4px">' + esc(post.Title) + (s.Field ? ' · ' + esc(s.Field) : '') + '</div>' + (s.Field ? '<div class="box" style="color:var(--slate)">Now: ' + esc(post[s.Field] || '(empty)') + '</div>' : '') : '') +
      '<div class="box">' + (post && s.Field ? 'Proposed: ' : '') + esc(s.Proposed || '') + '</div>' +
      (s.Why ? '<div class="meta" style="margin-top:6px">' + esc(s.Why) + '</div>' : '') +
      (s.Source ? '<div class="meta" style="margin-top:4px">Source: ' + esc(s.Source) + '</div>' : '') +
      (status === 'Pending' ? '<div class="row" style="margin-top:8px"><button class="btn red" data-acc="' + esc(s.id) + '">' + (post && s.Field ? 'Accept' : 'Add as idea') + '</button><button class="btn" data-rej="' + esc(s.id) + '">Reject</button></div>' : '') + '</div>';
  });
  return h;
}

function renderDetail(){
  var d = $('detail');
  if (!st.sel){ d.innerHTML = ''; return; }
  if (st.sel.indexOf('auto-') === 0 || st.sel.indexOf('rev-') === 0){
    var isRev = st.sel.indexOf('rev-') === 0;
    d.innerHTML = '<div class="panel"><div class="row between"><span class="lab">' + (isRev ? 'Sunday review' : 'Sortd automation · read-only') + '</span><button class="btn" data-close>Close</button></div><div class="box">' +
      (isRev ? 'Write your notes in Sunday notes by 9:30pm. The review runs at 9:45pm and leaves suggestions; nothing changes until you accept one.' : 'Built by the scheduled task on the day. Review the draft in the Sortd Social project, then post it from Instagram.') + '</div></div>';
    return;
  }
  var p = DATA.posts.filter(function(x){ return x.id === st.sel; })[0];
  if (!p){ d.innerHTML = ''; return; }
  var i = norm(p);
  var steps = i.kind === 'Task' ? ['Planned','Done'] : STEPS;
  var accName = {rach:'@rach.hannon', sortd:'Sortd', li:'LinkedIn', wn:'Substack', task:'Task'}[i.acc];
  var sec = function(name, canCopy){
    var v = p[name];
    if (st.editing === name) return '<div class="lab" style="margin-top:12px">' + name + '</div><textarea id="edtext">' + esc(v || '') + '</textarea><div class="row" style="margin-top:6px"><button class="btn red" data-save="' + name + '">Save</button><button class="btn" data-cancel>Cancel</button></div>';
    if (!v) return '';
    return '<div class="row between" style="margin-top:12px"><span class="lab">' + name + '</span><div class="row">' + (canCopy ? '<button class="btn" data-cp="' + name + '">Copy</button>' : '') + '<button class="btn" data-edit="' + name + '">Edit</button></div></div><div class="box">' + esc(v) + '</div>';
  };
  var missing = EDITABLE.filter(function(n){ return !p[n] && st.editing !== n; });
  d.innerHTML = '<div class="panel" id="dpanel"><div class="row between"><span class="lab">' + esc(accName) + ' · ' + (plabel(i) ? esc(plabel(i)) + ' · ' : '') + esc(i.kind) + (i.date ? ' · ' + fmt(i.date) : '') + '</span><button class="btn" data-close>Close</button></div>' +
    '<div class="bd" style="font-size:19px;margin-top:6px">' + esc(i.title) + '</div>' +
    '<div class="row" style="margin-top:10px">' + steps.map(function(s){ return '<button class="pill' + (i.status === s ? ' on' : '') + '" data-st="' + s + '">' + s + '</button>'; }).join('') + '</div>' +
    '<div class="row" style="margin-top:10px"><span class="meta">Posts</span><input type="date" id="pdate" value="' + esc(i.date || '') + '" style="width:auto"><span class="meta">Film</span><input type="date" id="pfilm" value="' + esc(i.film || '') + '" style="width:auto"><button class="btn" id="dsave">Save dates</button></div>' +
    sec('Hook', true) + sec('Brief', false) + sec('Shot list', false) + sec('B-roll needed', false) + sec('Caption', true) + sec('Hashtags', true) + sec('Alt text', true) + sec('Ends on', false) + sec('Checks', false) +
    (missing.length ? '<div class="row" style="margin-top:12px"><span class="meta">Add</span>' + missing.map(function(n){ return '<button class="btn" data-edit="' + n + '">' + n + '</button>'; }).join('') + '</div>' : '') +
    (i.kind !== 'Task' ? '<div class="lab" style="margin-top:14px">After posting</div><input type="url" id="plink" placeholder="Paste the post link" value="' + esc(i.link) + '" style="margin-top:4px"><textarea id="presults" placeholder="Results: saves, sends, profile visits, follows" style="min-height:70px;margin-top:6px">' + esc(p.Results || '') + '</textarea><button class="btn red" id="psave" style="margin-top:6px">Save and mark posted</button>' : '') +
    '</div>';
  if (window.innerWidth > 760) d.scrollIntoView({block:'nearest', behavior:'smooth'}); else document.getElementById('dpanel').scrollIntoView({block:'start', behavior:'smooth'});
}

// ---------- writes ----------
function replacePost(post){ DATA.posts = DATA.posts.map(function(p){ return p.id === post.id ? post : p; }); }
function savePost(id, fields, msg){
  return api('updatePost', {id:id, fields:fields}).then(function(r){ replacePost(r.post); st.editing = null; render(); toast(msg || 'Saved'); })
    .catch(function(e){ toast(e.message); });
}

// ---------- events ----------
document.addEventListener('click', function(e){
  var t = e.target.closest('button, [data-shot], [data-b], tr[data-w]');
  if (!t) return;
  var ds = t.dataset;
  if (t.id === 'pwgo') return login();
  if (t.id === 'logout'){ store.del('cc_pw'); pw = ''; $('app').classList.add('hidden'); $('login').classList.remove('hidden'); return; }
  if (t.id === 'refresh') return load(true);
  if (t.id === 'share'){ var txt = brollText(); if (navigator.share) navigator.share({title:'B-roll to get', text:txt}).catch(function(){}); else copy(txt, 'List'); return; }
  if (t.id === 'cplist') return copy(brollText(), 'List');
  if (ds.v){ st.view = ds.v; st.sel = null; st.editing = null; return render(); }
  if (ds.n !== undefined){ var n = +ds.n; st.w = n === 0 ? thisWeek() : Math.min(WEEKS, Math.max(1, st.w + n)); st.sel = null; return render(); }
  if (ds.cal){ st.cal = ds.cal; st.sel = null; return render(); }
  if (ds.sf){ st.sf = ds.sf; return render(); }
  if (ds.sg){ st.sg = ds.sg; return render(); }
  if (ds.filmed){ var fp = DATA.posts.filter(function(x){ return x.id === ds.filmed; })[0]; fp.Status = 'Filmed'; render(); return api('updatePost', {id: fp.id, fields: {Status: 'Filmed'}}).then(function(r){ replacePost(r.post); render(); toast('Marked filmed'); }).catch(function(e2){ toast(e2.message); load(true); }); }
  if (t.id === 'sshare'){ var stx = scriptText(scriptPosts()); if (navigator.share) navigator.share({title:'Scripts', text:stx}).catch(function(){}); else copy(stx, 'Scripts'); return; }
  if (t.id === 'scopy') return copy(scriptText(scriptPosts()), 'Scripts');
  if (ds.bf){ st.bf = ds.bf; return render(); }
  if (ds.w){ st.w = +ds.w; st.view = 'cal'; st.cal = 'week'; return render(); }
  if (ds.id){ st.sel = ds.id; st.editing = null; return render(); }
  if (ds.close !== undefined){ st.sel = null; st.editing = null; return render(); }
  if (ds.edit){ st.editing = ds.edit; renderDetail(); var ta = $('edtext'); if (ta) ta.focus(); return; }
  if (ds.cancel !== undefined){ st.editing = null; return renderDetail(); }
  if (ds.save){ var f = {}; f[ds.save] = $('edtext').value; return savePost(st.sel, f); }
  if (ds.cp){ var p = DATA.posts.filter(function(x){ return x.id === st.sel; })[0]; return copy(p[ds.cp] || '', ds.cp); }
  if (ds.st){ var sp = DATA.posts.filter(function(x){ return x.id === st.sel; })[0]; sp.Status = ds.st; render(); return savePost(st.sel, {Status: ds.st}, 'Status: ' + ds.st); }
  if (t.id === 'dsave'){ return savePost(st.sel, {'Date': $('pdate').value || null, 'Film day': $('pfilm').value || null, 'Status': ($('pdate').value && DATA.posts.filter(function(x){ return x.id === st.sel; })[0].Status === 'Idea') ? 'Planned' : undefined}, 'Dates saved'); }
  if (t.id === 'psave'){ return savePost(st.sel, {'Post link': $('plink').value.trim() || null, 'Results': $('presults').value || null, 'Status': 'Posted'}, 'Saved and marked posted'); }
  if (ds.shot){ st.shots[ds.shot] = !st.shots[ds.shot]; store.set('cc_shots', JSON.stringify(st.shots)); return render(); }
  if (ds.b){
    var b = DATA.broll.filter(function(x){ return x.id === ds.b; })[0]; b['Got it'] = !b['Got it']; render();
    return api('toggleBroll', {id: b.id, done: b['Got it']}).then(function(){ toast(b['Got it'] ? 'Got it' : 'Back on the list'); }).catch(function(e2){ b['Got it'] = !b['Got it']; render(); toast(e2.message); });
  }
  if (t.id === 'badd'){
    var v = $('bnew').value.trim(); if (!v){ $('berr').textContent = 'Describe the shot first'; return; }
    t.disabled = true;
    return api('addBroll', {shot: v}).then(function(r){ DATA.broll.push(r.broll); render(); toast('Added to the library'); }).catch(function(e2){ t.disabled = false; $('berr').textContent = e2.message; });
  }
  if (t.id === 'iadd'){
    var iv = $('inew').value.trim(); if (!iv){ $('ierr').textContent = 'Give the idea a title first'; return; }
    t.disabled = true;
    return api('addPost', {fields: {Title: iv, Pillar: $('ipil').value, Account: '@rach.hannon', Status: 'Idea'}}).then(function(r){ DATA.posts.push(r.post); render(); toast('Idea added'); }).catch(function(e2){ t.disabled = false; $('ierr').textContent = e2.message; });
  }
  if (t.id === 'nsave'){
    var nv = $('nt').value.trim(); if (!nv){ $('nerr').textContent = 'Write a note first'; return; }
    t.disabled = true;
    return api('addNote', {text: nv}).then(function(r){ DATA.notes.unshift(r.note); render(); toast('Notes saved'); }).catch(function(e2){ t.disabled = false; $('nerr').textContent = e2.message; });
  }
  if (ds.acc || ds.rej){
    var sid = ds.acc || ds.rej; t.disabled = true;
    return api('decide', {id: sid, accept: !!ds.acc}).then(function(r){
      DATA.suggestions = DATA.suggestions.map(function(s){ return s.id === sid ? r.suggestion : s; });
      if (r.applied){ if (DATA.posts.some(function(p){ return p.id === r.applied.id; })) replacePost(r.applied); else DATA.posts.push(r.applied); }
      render(); toast(ds.acc ? (r.applied ? 'Applied' : 'Accepted') : 'Rejected');
    }).catch(function(e2){ t.disabled = false; toast(e2.message); });
  }
});
document.addEventListener('input', function(e){
  var map = {nt:'nerr', bnew:'berr', inew:'ierr', pw:'pwerr'};
  if (map[e.target.id]) $(map[e.target.id]).textContent = '';
});
$('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') login(); });

// ---------- startup ----------
function load(manual){
  return api('load').then(function(r){
    DATA = r;
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    if (!manual) st.w = thisWeek();
    render(); if (manual) toast('Up to date');
  }).catch(function(e){
    if (e.status === 401){ store.del('cc_pw'); pw = ''; $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('pwerr').textContent = 'Wrong password. Try again.'; }
    else { $('pwerr').textContent = e.message; toast(e.message); }
    throw e;
  });
}
function login(){
  var v = $('pw').value.trim(); if (!v){ $('pwerr').textContent = 'Enter the password'; return; }
  pw = v; $('pwgo').disabled = true;
  load().then(function(){ store.set('cc_pw', pw); }).catch(function(){}).then(function(){ $('pwgo').disabled = false; });
}
if (pw) load().catch(function(){});
})();
</script>
</body>
