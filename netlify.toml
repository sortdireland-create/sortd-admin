[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Runs generate-listings automatically once a day so camp listings stay in
# sync with Airtable without anyone clicking "Generate" in /admin.
[functions."generate-listings"]
  schedule = "@daily"

# Password-protect the admin page via Netlify redirect with basic auth
# (actual auth is handled in the function itself for simplicity)
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Content calendar for @rach.hannon and Sortd (public/content.html).
# Data and the password check live in netlify/functions/content.js.
[[redirects]]
  from = "/content"
  to = "/content.html"
  status = 200

[[redirects]]
  from = "/content-classic"
  to = "/content-classic.html"
  status = 200

# Always fetch the latest calendar page, so phones don't hold on to an old copy.
[[headers]]
  for = "/content*"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200
